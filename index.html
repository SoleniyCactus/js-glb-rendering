<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            background: #0B0E14;
            color: #F8FAFC;
            overflow: hidden;
            /* Prevent mobile bounce/overscroll */
            overscroll-behavior: none;
            /* Prevent text selection on touch */
            -webkit-user-select: none;
            user-select: none;
            /* Prevent iOS zoom on double-tap */
            touch-action: none;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            /* Prevent touch callout on iOS */
            -webkit-touch-callout: none;
            /* Disable all browser touch gestures */
            touch-action: none;
        }

        .controls {
            position: fixed;
            z-index: 1000; /* above the 3D empty labels (10..95) */
            top: 20px;
            right: 20px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(248, 250, 252, 0.1);
            border-radius: 12px;
            padding: 20px;
            min-width: 280px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s, opacity 0.3s;
        }

        .controls.hidden {
            transform: translateY(20px);
            opacity: 0;
            pointer-events: none;
        }

        .controls::-webkit-scrollbar {
            width: 8px;
        }

        .controls::-webkit-scrollbar-track {
            background: #1E293B;
            border-radius: 4px;
        }

        .controls::-webkit-scrollbar-thumb {
            background: #38BDF8;
            border-radius: 4px;
        }

        .controls h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #F8FAFC;
        }

        .controls-subtitle {
            font-size: 11px;
            color: #64748B;
            margin-bottom: 12px;
        }

        .control-group {
            margin-bottom: 16px;
        }

        .control-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #94A3B8;
            font-weight: 500;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            background: #1E293B;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #38BDF8;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: #22D3EE;
            transform: scale(1.1);
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #38BDF8;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #38BDF8 0%, #22D3EE 100%);
            border: none;
            border-radius: 8px;
            color: #0B0E14;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
        }

        .button:active {
            transform: translateY(0);
        }

        .separator {
            height: 1px;
            background: rgba(248, 250, 252, 0.1);
            margin: 16px 0;
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: #38BDF8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .value {
            color: #22D3EE;
            font-family: 'SF Mono', 'Consolas', monospace;
            font-size: 12px;
        }

        .file-input {
            margin-bottom: 20px;
        }

        .file-input input[type="file"] {
            display: none;
        }

        .file-label {
            display: block;
            padding: 12px;
            background: linear-gradient(135deg, #F97316 0%, #F59E0B 100%);
            border-radius: 8px;
            text-align: center;
            color: #0B0E14;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .file-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.4);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 13px;
            color: #94A3B8;
            cursor: pointer;
            margin: 0;
        }

        .color-picker {
            width: 100%;
            height: 40px;
            border: 1px solid rgba(248, 250, 252, 0.1);
            border-radius: 8px;
            background: #1E293B;
            cursor: pointer;
        }

        .value-input {
            width: 60px;
            padding: 2px 6px;
            background: #1E293B;
            border: 1px solid rgba(248, 250, 252, 0.1);
            border-radius: 4px;
            color: #22D3EE;
            font-size: 12px;
            text-align: center;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
        }

        .value-input:focus {
            outline: none;
            border-color: #22D3EE;
        }

        /* Remove spinner arrows for number inputs */
        .value-input::-webkit-outer-spin-button,
        .value-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .value-input[type=number] {
            -moz-appearance: textfield;
        }

        .hint-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            box-sizing: border-box;
            max-width: min(320px, calc(100vw - 40px));
            padding: 14px 40px 12px 16px;
            /* Подсказка не должна перехватывать управление моделью: тапы и
               драги проходят сквозь неё к канвасу, кликабелен только крестик. */
            pointer-events: none;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(248, 250, 252, 0.12);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
            color: #F8FAFC;
            font-size: 13px;
            line-height: 1.45;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
        }

        .hint-panel.visible {
            opacity: 1;
            visibility: visible;
            transform: none;
        }

        .hint-title {
            font-size: 13px;
            font-weight: 600;
            color: #F8FAFC;
            margin-bottom: 8px;
            padding-right: 4px;
        }

        .hint-title span {
            color: #38BDF8;
        }

        .hint-list {
            list-style: none;
            margin: 0;
            padding: 0;
            font-size: 12px;
        }

        .hint-list li {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 5px;
        }

        .hint-list .key {
            flex: 0 0 40%;
            color: #22D3EE;
            font-weight: 600;
            font-family: 'SF Mono', 'Consolas', monospace;
            font-size: 11px;
        }

        .hint-list .act {
            flex: 1 1 auto;
            color: #CBD5E1;
        }

        .hint-close {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            padding: 0;
            background: none;
            border: none;
            color: #94A3B8;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            border-radius: 6px;
            pointer-events: auto;
        }

        .hint-close:hover {
            color: #F8FAFC;
            background: rgba(248, 250, 252, 0.08);
        }

        .hint-foot {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(248, 250, 252, 0.1);
            font-size: 11px;
            color: #64748B;
        }

        .debug {
            position: fixed;
            z-index: 999;
            bottom: 20px;
            left: 20px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(248, 250, 252, 0.1);
            border-radius: 12px;
            padding: 16px;
            font-size: 11px;
            color: #94A3B8;
            line-height: 1.8;
            font-family: 'SF Mono', 'Consolas', monospace;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            display: none;
        }

        .debug div {
            margin-bottom: 4px;
        }

        .debug span {
            color: #22D3EE;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30, 41, 59, 0.95);
            padding: 24px 48px;
            border-radius: 12px;
            font-size: 16px;
            color: #F8FAFC;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .empty-label {
            position: absolute;
            z-index: 7;
            box-sizing: border-box;
            /* padding/border in em -> the whole pill scales with its font-size,
               which the render loop drives from model size + camera distance */
            padding: 0.32em 0.7em;
            font-size: 12px;
            line-height: 1.25;
            color: #FFFF00;
            font-family: 'SF Mono', 'Consolas', monospace;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.94);
            border: 0.08em solid rgba(34, 211, 238, 0.45);
            border-radius: 999px;
            text-shadow: 0.08em 0.08em 0.17em rgba(0,0,0,0.8);
            cursor: pointer;
            transition: color 0.1s;
            white-space: nowrap;
            /* stay centered on the empty even when the description pops out */
            transform: translate(-50%, -50%);
        }

        .empty-label.hovered {
            color: #00FFFF;
            border-color: rgba(34, 211, 238, 0.8);
        }

        .empty-label > div:first-child {
            max-width: 60vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-tooltip {
            position: fixed;
            z-index: 96;
            display: none;
            box-sizing: border-box;
            /* max-content = одна строка, пока влезает; перенос только по границе 72vw */
            width: max-content;
            max-width: min(26em, 72vw);
            padding: 0.55em 0.7em;
            transform: translate(-50%, 0);
            color: #E2E8F0;
            background: rgba(15, 23, 42, 0.96);
            border: 0.08em solid rgba(34, 211, 238, 0.45);
            border-radius: 0.6em;
            font-family: 'SF Mono', 'Consolas', monospace;
            line-height: 1.4;
            text-align: left;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            pointer-events: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }

        .toggle-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #F97316;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(249, 115, 22, 0.4);
            transition: all 0.2s;
            z-index: 1001;
        }

        .toggle-controls:hover {
            background: #EA580C;
            transform: scale(1.05);
        }

        .toggle-controls:active {
            transform: scale(0.95);
        }

        /* Mobile adaptations */
        @media (max-width: 768px) {
            .hint-panel {
                top: 10px;
                left: 10px;
                max-width: calc(100vw - 20px);
                font-size: 12px;
                padding: 12px 36px 10px 12px;
            }

            .controls {
                top: auto;
                bottom: 90px;
                right: 20px;
                left: auto;
                min-width: 280px;
                max-width: 320px;
                max-height: 50vh;
                padding: 16px;
            }

            .controls h2 {
                font-size: 16px;
            }

            .control-group label {
                font-size: 11px;
            }

            input[type="range"] {
                height: 6px;
            }

            input[type="range"]::-webkit-slider-thumb {
                width: 18px;
                height: 18px;
            }

            input[type="range"]::-moz-range-thumb {
                width: 18px;
                height: 18px;
            }

            button {
                padding: 10px 16px;
                font-size: 13px;
            }

            .debug {
                left: 10px;
                bottom: 10px;
                font-size: 10px;
                padding: 12px;
            }

            .empty-label {
                /* font-size is driven per-frame from model size + distance */
                text-shadow: 0.14em 0.14em 0.28em rgba(0,0,0,0.9);
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <canvas id="overlayCanvas" style="position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5;"></canvas>

    <div class="hint-panel" id="hintPanel" role="status" aria-live="polite">
        <button class="hint-close" id="hintClose" aria-label="Скрыть подсказку">✕</button>
        <div class="hint-title" id="hintTitle">Управление</div>
        <ul class="hint-list" id="hintList"></ul>
        <div class="hint-foot" id="hintFoot">Скрыть — нажатие в любом месте</div>
    </div>

    <div class="controls hidden">
        <h2>3D Model Viewer</h2>
        <div class="controls-subtitle">
            Rotate: LMB Drag • Pan: MMB Drag
        </div>

        <div class="file-input">
            <input type="file" id="fileInput" accept=".glb,.gltf">
            <label for="fileInput" class="file-label">Загрузить GLB модель</label>
        </div>

        <div class="control-group">
            <label>Model: <span class="value" id="modelName">No model loaded</span></label>
        </div>

        <div class="control-group">
            <label>Rotation X: <span class="value" id="rotXDisplay">20.0</span>  Y: <span class="value" id="rotYDisplay">30.0</span></label>
        </div>

        <div class="control-group">
            <label>Pan X: <span class="value" id="panXDisplay">0.00</span>  Y: <span class="value" id="panYDisplay">0.00</span></label>
        </div>

        <div class="separator"></div>

        <div class="section-title">Position</div>
        <div class="control-group">
            <label>Pos X <input type="number" class="value-input" id="panXInput" value="0.000" step="0.001"></label>
            <input type="range" id="panX" min="-10" max="10" value="0" step="0.001">
        </div>
        <div class="control-group">
            <label>Pos Y <input type="number" class="value-input" id="panYInput" value="0.000" step="0.001"></label>
            <input type="range" id="panY" min="-10" max="10" value="0" step="0.001">
        </div>
        <button class="button" id="resetPosition">Reset Position</button>

        <div class="separator"></div>

        <div class="control-group">
            <label>Model Scale <input type="number" class="value-input" id="scaleInput" value="1.000" step="0.001" min="0.01" max="10"></label>
            <input type="range" id="scale" min="0.01" max="10" value="1" step="0.001">
        </div>

        <div class="separator"></div>

        <div class="checkbox-group">
            <input type="checkbox" id="autoSpin">
            <label for="autoSpin">Auto-Spin</label>
        </div>
        <div class="control-group" id="spinSpeedGroup" style="display: none;">
            <label>Spin Speed <input type="number" class="value-input" id="spinSpeedInput" value="1.000" step="0.001" min="-5" max="5"> <span class="value" id="spinDirection">Right</span></label>
            <input type="range" id="spinSpeed" min="-5" max="5" value="1" step="0.001">
        </div>

        <div class="separator"></div>

        <div class="section-title">Base Rotation (Blender-style)</div>
        <div class="control-group">
            <label>Rotation X <input type="number" class="value-input" id="baseRotXInput" value="0.000" step="0.001" min="-180" max="180">°</label>
            <input type="range" id="baseRotX" min="-180" max="180" value="0" step="0.001">
        </div>
        <div class="control-group">
            <label>Rotation Y <input type="number" class="value-input" id="baseRotYInput" value="0.000" step="0.001" min="-180" max="180">°</label>
            <input type="range" id="baseRotY" min="-180" max="180" value="0" step="0.001">
        </div>
        <div class="control-group">
            <label>Rotation Z <input type="number" class="value-input" id="baseRotZInput" value="0.000" step="0.001" min="-180" max="180">°</label>
            <input type="range" id="baseRotZ" min="-180" max="180" value="0" step="0.001">
        </div>
        <button class="button" id="resetBaseRotation">Reset Base Rotation</button>

        <div class="separator"></div>

        <div class="section-title">View Rotation</div>
        <div class="control-group">
            <label>Pitch (X) <input type="number" class="value-input" id="viewRotXInput" value="20.000" step="0.001" min="-180" max="180">°</label>
            <input type="range" id="viewRotX" min="-180" max="180" value="20" step="0.001">
        </div>
        <div class="control-group">
            <label>Yaw (Y) <input type="number" class="value-input" id="viewRotYInput" value="30.000" step="0.001" min="-180" max="180">°</label>
            <input type="range" id="viewRotY" min="-180" max="180" value="30" step="0.001">
        </div>
        <button class="button" id="resetViewRotation">Reset View Rotation</button>

        <div class="separator"></div>

        <div class="checkbox-group">
            <input type="checkbox" id="showDebug">
            <label for="showDebug">Debug</label>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="showEmptyLabels" checked>
            <label for="showEmptyLabels">Show Empty Labels</label>
        </div>

        <div class="control-group">
            <label>Empty Label Color</label>
            <input type="color" id="emptyLabelColor" class="color-picker" value="#ffff00">
        </div>

        <div class="control-group">
            <label>Empty Hover Color</label>
            <input type="color" id="emptyHoverColor" class="color-picker" value="#00ffff">
        </div>

        <div class="control-group">
            <label>Hover Radius Color</label>
            <input type="color" id="hoverRadiusColor" class="color-picker" value="#000000">
        </div>

        <div class="control-group">
            <label>Clear Color</label>
            <input type="color" id="clearColor" class="color-picker" value="#0b0e14">
        </div>
    </div>

    <div class="debug" id="debug">
        <div id="statsInfo">No model loaded</div>
        <div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(248, 250, 252, 0.1);">
            <div>FPS: <span id="fps">0</span></div>
            <div>Frame Time: <span id="frameTime">0.00</span> ms</div>
            <div>Render: <span id="renderTime">0.00</span> ms</div>
            <div>Labels: <span id="labelStats">0</span></div>
        </div>
    </div>

    <div class="loading" id="loading" style="display: none;">Loading...</div>

    <button class="toggle-controls">☰</button>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // Scene setup
        const canvas = document.getElementById('canvas');
        const overlayCanvas = document.getElementById('overlayCanvas');
        const overlayCtx = overlayCanvas.getContext('2d');

        // Set overlay canvas size
        overlayCanvas.width = window.innerWidth;
        overlayCanvas.height = window.innerHeight;

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 8);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // ------------------------------------------------------------------
        // Lighting: direct sunlight (hard sun + sky IBL + a bit of bounce)
        // ------------------------------------------------------------------
        const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // Direction the sun is coming FROM (upper right, slightly in front).
        const SUN_DIR = new THREE.Vector3(4.5, 6.5, 3.5).normalize();
        const SUN_COLOR = 0xfff2dc;      // slightly warm midday sun
        const SUN_INTENSITY = 3.0;
        const SKY_ZENITH = new THREE.Color(0x2e6fd0).multiplyScalar(1.5);
        const SKY_HORIZON = new THREE.Color(0xcfe2f7).multiplyScalar(1.25);
        const SKY_GROUND = new THREE.Color(0x9a8465).multiplyScalar(0.6);
        const SUN_DISC_GAIN = 45;        // HDR brightness of the sun blob in the env map

        // Tone mapping: keeps sun highlights from clipping and makes metals readable.
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // Procedural sunny sky -> used as IBL (scene.environment).
        // This is what makes metallic / rough materials visible at all: without an
        // environment map a metal has nothing to reflect and renders nearly black.
        function createSunnySkyEnvironment() {
            const envScene = new THREE.Scene();
            const R = 50;

            const skyMat = new THREE.ShaderMaterial({
                side: THREE.BackSide,
                depthWrite: false,
                uniforms: {
                    topColor: { value: SKY_ZENITH },
                    horizonColor: { value: SKY_HORIZON },
                    groundColor: { value: SKY_GROUND }
                },
                vertexShader: /* glsl */`
                    varying vec3 vDir;
                    void main() {
                        vDir = normalize(position);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: /* glsl */`
                    uniform vec3 topColor;
                    uniform vec3 horizonColor;
                    uniform vec3 groundColor;
                    varying vec3 vDir;
                    void main() {
                        float h = clamp(vDir.y, -1.0, 1.0);
                        vec3 sky = mix(horizonColor, topColor, pow(max(h, 0.0), 0.55));
                        vec3 ground = mix(horizonColor, groundColor, pow(max(-h, 0.0), 0.5));
                        gl_FragColor = vec4(mix(ground, sky, step(0.0, h)), 1.0);
                    }
                `
            });

            envScene.add(new THREE.Mesh(new THREE.SphereGeometry(R, 48, 24), skyMat));

            // Bright sun blob: gives a hot specular highlight on glossy/metal surfaces.
            const sunDisc = new THREE.Mesh(
                new THREE.SphereGeometry(R * 0.11, 24, 12),
                new THREE.MeshBasicMaterial({

            pmrem.dispose();

            envScene.traverse((o) => {

            });

            sun.position.copy(SUN_DIR).multiplyScalar(dist);
            sun.target.position.set(0, 0, 0);
            sun.target.updateMatrixWorld();

            const cam = sun.shadow.camera;
            const extent = Math.max(radius * 2.2, 2);
            cam.left = -extent;
            cam.right = extent;
            cam.top = extent;
            cam.bottom = -extent;
            cam.near = Math.max(dist - radius * 3, 0.05);
            cam.far = dist + radius * 4;
            cam.updateProjectionMatrix();

        showDebugCheckbox.onchange = () => {
            showDebug = showDebugCheckbox.checked;
            debug.style.display = showDebug ? 'block' : 'none';
        };

        showEmptyLabelsCheckbox.onchange = () => {
            showEmptyLabels = showEmptyLabelsCheckbox.checked;
            if (!showEmptyLabels) {
                clearEmptyLabels();
            }
        };

        clearColorPicker.oninput = () => {
            clearColor = new THREE.Color(clearColorPicker.value);
            scene.background = clearColor;
        };

        emptyLabelColorPicker.oninput = () => {
            emptyLabelColor = emptyLabelColorPicker.value;
        };

        emptyHoverColorPicker.oninput = () => {
            emptyHoverColor = emptyHoverColorPicker.value;
        };

        hoverRadiusColorPicker.oninput = () => {
            // Convert hex to rgba with 0.5 alpha
            const hex = hoverRadiusColorPicker.value;
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            hoverRadiusColor = `rgba(${r}, ${g}, ${b}, 0.5)`;
        };

        // Reset buttons
        document.getElementById('resetPosition').onclick = () => {
            panX = 0;
            panY = 0;
            updatePan();
        };

        document.getElementById('resetBaseRotation').onclick = () => {
            baseRotX = 0;
            baseRotY = 0;
            baseRotZ = 0;
            updateBaseRotation();
        };

        document.getElementById('resetViewRotation').onclick = () => {
            viewRotX = 20;
            viewRotY = 30;

            // Reset quaternion to match the euler angles
            const DEG2RAD = Math.PI / 180;
            viewRotationQuat.setFromEuler(new THREE.Euler(
                viewRotX * DEG2RAD,
                viewRotY * DEG2RAD,
                0,
                'YXZ'
            ));

            updateViewRotation();
        };

        // Update functions
        function updatePan() {
            panXSlider.value = panX;
            panYSlider.value = panY;
            panXInput.value = panX.toFixed(3);
            panYInput.value = panY.toFixed(3);
            document.getElementById('panXDisplay').textContent = panX.toFixed(3);
            document.getElementById('panYDisplay').textContent = panY.toFixed(3);

            // Apply pan to panGroup (not camera) - screen space movement
            panGroup.position.set(panX, panY, 0);
        }

        function updateViewRotation() {
            viewRotXSlider.value = viewRotX;
            viewRotYSlider.value = viewRotY;
            viewRotXInput.value = viewRotX.toFixed(3);
            viewRotYInput.value = viewRotY.toFixed(3);
            document.getElementById('rotXDisplay').textContent = viewRotX.toFixed(3);
            document.getElementById('rotYDisplay').textContent = viewRotY.toFixed(3);

            // Apply quaternion to viewRotationGroup (like desktop applyRotation)
            viewRotationGroup.quaternion.copy(viewRotationQuat);
        }

        function updateBaseRotation() {
            baseRotXSlider.value = baseRotX;
            baseRotYSlider.value = baseRotY;
            baseRotZSlider.value = baseRotZ;
            baseRotXInput.value = baseRotX.toFixed(3);
            baseRotYInput.value = baseRotY.toFixed(3);
            baseRotZInput.value = baseRotZ.toFixed(3);

            baseRotationGroup.rotation.order = 'XYZ';
            baseRotationGroup.rotation.x = baseRotX * Math.PI / 180;
            baseRotationGroup.rotation.y = baseRotY * Math.PI / 180;
            baseRotationGroup.rotation.z = baseRotZ * Math.PI / 180;
        }

        function applyModelScale() {
            baseRotationGroup.scale.setScalar(modelScale);
            // Shadow frustum follows the scaled model, otherwise big models get clipped shadows
            updateSunForRadius(currentRadius * modelScale);
        }

        function clearEmptyLabels() {
            emptyLabels.forEach(label => label.element.remove());
            emptyLabels = [];
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        }

        let projectedEmpties = [];

        // Persistent description tooltip (created once, reused every frame)
        const tooltipEl = document.createElement('div');
        tooltipEl.className = 'empty-tooltip';
        document.body.appendChild(tooltipEl);

        function getEmptyDescription(object, gltfNode) {
            const extras = gltfNode && gltfNode.extras;
            const userData = object && object.userData;
            const sources = [userData, userData && userData.gltfExtensions, extras, gltfNode];

            for (const source of sources) {
                if (!source || typeof source !== 'object') continue;

                const key = Object.keys(source).find((name) => name.toLowerCase() === 'description');
                if (key !== undefined && source[key] !== null && source[key] !== undefined) {
                    const description = source[key];
                    return typeof description === 'string' ? description.trim() : String(description).trim();
                }
            }

            return '';
        }

        // Load model
        const loader = new GLTFLoader();

        function loadModelFromFile(file, url) {
            loading.style.display = 'block';

            loader.load(url, (gltf) => {
                loading.style.display = 'none';

                // Remove old model (it lives inside its own centering group)
                if (currentCentering) {
                    baseRotationGroup.remove(currentCentering);
                    currentCentering = null;
                } else if (currentModel) {
                    baseRotationGroup.remove(currentModel);
                }

                activeEmpty = null;
                projectedEmpties = [];

                currentModel = gltf.scene;

                // Center model using a centering group (like desktop glTranslatef)
                const box = new THREE.Box3().setFromObject(currentModel);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                console.log('Model bounding box:', box);
                console.log('Model center:', center);
                console.log('Model size:', size);

                // Fit the sunlight and its shadow frustum to the loaded model
                currentRadius = Math.max(size.length() * 0.5, 0.001);
                updateSunForRadius(currentRadius * modelScale);
                currentModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                // Create centering group that offsets the model to put its center at origin
                const centeringGroup = new THREE.Group();
                centeringGroup.position.set(-center.x, -center.y, -center.z);

                // Add model to centering group (model stays at 0,0,0 in its own space)
                centeringGroup.add(currentModel);
                console.log('Model centered via group offset:', centeringGroup.position);

                // Add centering group to base rotation group
                baseRotationGroup.add(centeringGroup);
                currentCentering = centeringGroup;

                // Extract empties - search in raw gltf.parser data AND scene.traverse
                empties = [];

                // Method 1: Use scene.traverse (finds most empties)
                const foundNames = new Set();
                const foundObjects = new Set();
                const normalizeEmptyName = (name) => name.replace(/_/g, ' ').replace(/\s+/g, ' ').trim();
                const addEmpty = (object, name, rawNode) => {
                    const displayName = normalizeEmptyName(name);
                    if (!object || foundObjects.has(object.uuid) || foundNames.has(displayName)) return false;

                    foundObjects.add(object.uuid);
                    foundNames.add(displayName);
                    empties.push({
                        name: displayName,
                        object: object,
                        description: getEmptyDescription(object, rawNode)
                    });
                    return true;
                };
                const rawNodeByName = new Map();
                if (gltf.parser && gltf.parser.json && gltf.parser.json.nodes) {
                    gltf.parser.json.nodes.forEach((node) => {
                        if (node.name) rawNodeByName.set(normalizeEmptyName(node.name), node);
                    });
                }
                gltf.scene.traverse((node) => {
                    if (node.type === 'Object3D' && !node.isMesh && !node.isLight &&
                        !node.isCamera && !node.isBone && node.name) {
                        const rawNode = rawNodeByName.get(normalizeEmptyName(node.name));
                        if (addEmpty(node, node.name, rawNode)) {
                            console.log('Found empty via traverse:', node.name);
                        }
                    }
                });

                // Method 2: Check raw nodes from GLTF (might find missing empties)
                if (gltf.parser && gltf.parser.json && gltf.parser.json.nodes) {
                    const promises = gltf.parser.json.nodes.map((node, index) => {
                        if (node.name && (node.mesh === undefined || node.mesh < 0) &&
                            !foundNames.has(normalizeEmptyName(node.name))) {
                            // This is an empty in GLTF that wasn't found by traverse
                            // Try to find it in the scene by name
                            const sceneNode = gltf.scene.getObjectByName(node.name) ||
                                gltf.scene.getObjectByName(node.name.replace(/_/g, ' '));
                            if (sceneNode) {
                                if (addEmpty(sceneNode, node.name, node)) {
                                    console.log('Found empty via parser:', node.name);
                                }
                            } else {
                                console.warn('GLTF node', node.name, 'not found in scene, loading manually...');
                                // Load the node manually using parser
                                return gltf.parser.getDependency('node', index).then(object3D => {
                                    if (object3D) {
                                        // Add to scene so it gets proper world transforms
                                        currentModel.add(object3D);
                                        if (addEmpty(object3D, node.name, node)) {
                                            console.log('Manually loaded empty:', node.name);
                                        }
                                    }
                                }).catch(err => {
                                    console.error('Failed to load node', node.name, err);
                                });
                            }
                        }
                        return null;
                    });

                    // Wait for all manual loads to complete
                    Promise.all(promises.filter(p => p)).then(() => {
                        console.log('All empties loaded, total:', empties.length);
                    });
                }

                // Update stats
                let triangles = 0;
                currentModel.traverse((child) => {
                    if (child.isMesh) {
                        triangles += child.geometry.index ?
                            child.geometry.index.count / 3 :
                            child.geometry.attributes.position.count / 3;
                    }
                });

                const fileName = file ? file.name : url.split('/').pop();
                statsInfo.innerHTML = `Model: ${fileName}<br>Triangles: ${Math.floor(triangles).toLocaleString()}<br>Empties: ${empties.length}<br>Radius: ${currentRadius.toFixed(3)}`;
                document.getElementById('modelName').textContent = fileName;
                if (file) URL.revokeObjectURL(url);
            }, undefined, (error) => {
                loading.style.display = 'none';
                console.error('Error loading model:', error);
            });
        }

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            loadModelFromFile(file, url);
        };

        // Initialize quaternion from initial euler angles
        const DEG2RAD = Math.PI / 180;
        viewRotationQuat.setFromEuler(new THREE.Euler(
            viewRotX * DEG2RAD,
            viewRotY * DEG2RAD,
            0,
            'YXZ'
        ));

        // Initialize camera position
        updateViewRotation();
        updatePan();

        // Load default model
        loadModelFromFile(null, 'mks.glb');

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            overlayCanvas.width = window.innerWidth;
            overlayCanvas.height = window.innerHeight;
        });

        // Set initial background
        scene.background = clearColor;

        // --- Empty label tuning ---------------------------------------------
        // Label height in world units, as a fraction of the model radius; the pixel
        // size then follows the projection at the empty's distance to the camera.
        const LABEL_WORLD_FRACTION = isMobileDevice ? 0.18 : 0.08;
        const LABEL_SIZE_SCALE = 0.2;          // все размеры подписи в 5 раз меньше
        const LABEL_MIN_FONT_PX = isMobileDevice ? 5 : 4; // только порог читаемости
        // Жёсткий потолок в пикселях: подписи не раздуваются вместе с моделью.
        const LABEL_MAX_FONT_PX = isMobileDevice ? 10 : 9;
        // Потолок относительно того, как модель выглядит на экране: подпись не может
        // быть больше этой доли проецируемого радиуса модели (иначе мелкая модель
        // тонет под плашками).
        const LABEL_MAX_MODEL_FRACTION = 0.16;
        const LABEL_HIDE_BELOW_PX = 2;         // мельче — подпись не рисуем вовсе
        const LABEL_DEPTH_FADE = 0.45;         // 0 = no fade, 1 = farthest label fully transparent
        // Описание читается независимо от размера плашки: свой диапазон кегля
        const TOOLTIP_MIN_FONT_PX = isMobileDevice ? 12 : 11;
        const TOOLTIP_MAX_FONT_PX = 16;
        // Hit area never shrinks with the label, otherwise small labels are untappable
        const LABEL_HIT_MIN_RADIUS_PX = isMobileDevice ? 26 : 10;

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            const frameStart = performance.now();

            // Auto-spin
            if (autoSpin) {
                viewRotY += spinSpeed;

                // Update quaternion from euler angles
                const DEG2RAD = Math.PI / 180;
                viewRotationQuat.setFromEuler(new THREE.Euler(
                    viewRotX * DEG2RAD,
                    viewRotY * DEG2RAD,
                    0,
                    'YXZ'
                ));

                updateViewRotation();
            }

            // FPS counter
            frameCount++;
            const currentTime = performance.now();
            if (currentTime - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = currentTime;
            }

            // Render empty labels
            if (showEmptyLabels && empties.length > 0) {
                clearEmptyLabels();

                const labelData = [];
                projectedEmpties = [];

                // Labels are billboards attached to the empty: their *world* size is
                // a fraction of the model radius, and the on-screen size is that world
                // size projected through the camera at the empty's own depth.
                //   px = worldSize * (viewportHalfHeight / (tan(fov/2) * distance))
                const tanHalfFov = Math.tan(camera.fov * Math.PI / 360);
                const viewportHalfH = window.innerHeight * 0.5;
                const worldRadius = Math.max(currentRadius * modelScale, 0.001);
                const labelWorldSize = worldRadius * LABEL_WORLD_FRACTION;
                const pxPerWorldUnit = (distance) =>
                    viewportHalfH / (tanHalfFov * Math.max(distance, 0.001));

                // The model is centered on the origin, so its distance to the camera is
                // simply |camera.position|. Its projected radius sets the hard ceiling for
                // the label size: a model that looks small on screen gets small labels.
                const modelPxRadius = Math.max(
                    worldRadius * pxPerWorldUnit(camera.position.length()),
                    0.001
                );
                const maxFontPx = Math.max(
                    Math.min(modelPxRadius * LABEL_MAX_MODEL_FRACTION, LABEL_MAX_FONT_PX),
                    0.5
                );
                const minFontPx = Math.min(LABEL_MIN_FONT_PX, maxFontPx);

                empties.forEach(empty => {
                    const worldPos = new THREE.Vector3();
                    empty.object.getWorldPosition(worldPos);

                    // Project to screen space
                    const screenPos = worldPos.clone();
                    screenPos.project(camera);

                    // Check if in front of camera
                    if (screenPos.z < 1) {
                        const x = (screenPos.x + 1) / 2 * window.innerWidth;
                        const y = (-screenPos.y + 1) / 2 * window.innerHeight;

                        const camDist = Math.max(worldPos.distanceTo(camera.position), 0.001);
                        // Base size is 5x smaller (LABEL_SIZE_SCALE) and there is no fixed
                        // upper clamp any more: the pill keeps growing linearly with model
                        // size and with proximity to the camera. It is only bounded by the
                        // model's own projected size, so it can never swamp the model.
                        const fontSize = Math.max(
                            Math.min(
                                labelWorldSize * pxPerWorldUnit(camDist) * LABEL_SIZE_SCALE,
                                maxFontPx
                            ),
                            minFontPx
                        );

                        // Below this the pill is a 1-2px speck, i.e. visual dirt on the
                        // model: better to drop the label than to draw a dot.
                        if (fontSize < LABEL_HIDE_BELOW_PX) return;

                        overlayCtx.font = `${fontSize.toFixed(2)}px 'SF Mono', 'Consolas', monospace`;
                        const textWidth = overlayCtx.measureText(empty.name).width;

                        labelData.push({
                            name: empty.name,
                            empty: empty,
                            description: empty.description,
                            x: x,
                            y: y,
                            depth: screenPos.z,
                            camDist: camDist,
                            fontSize: fontSize,
                            // visual size of the pill...
                            pillRadiusX: textWidth / 2 + fontSize * 0.75,
                            pillRadiusY: fontSize * 0.95,
                            // ...and a hit area that never shrinks with it
                            hoverRadiusX: Math.max(textWidth / 2 + fontSize * 0.75, LABEL_HIT_MIN_RADIUS_PX),
                            hoverRadiusY: Math.max(fontSize * 0.95, LABEL_HIT_MIN_RADIUS_PX * 0.6),
                            zIndex: 10,
                            opacity: 1
                        });
                        projectedEmpties.push(labelData[labelData.length - 1]);
                    }
                });

                // Find closest hovered empty (for mouse and touch).
                // camDist instead of NDC depth: the labels are now sized by it, so
                // picking and drawing order use the same metric.
                let closestIndex = -1;
                let closestDepth = Infinity;
                labelData.forEach((data, i) => {
                    const dx = mouseX - data.x;
                    const dy = mouseY - data.y;
                    const ellipseDistance =
                        (dx * dx) / (data.hoverRadiusX * data.hoverRadiusX) +
                        (dy * dy) / (data.hoverRadiusY * data.hoverRadiusY);

                    if (ellipseDistance <= 1) {
                        if (data.camDist < closestDepth) {
                            closestDepth = data.camDist;
                            closestIndex = i;
                        }
                    }
                });

                // Desktop activates an empty by hover; mobile activates it by tap.
                if (window.innerWidth > 768 || isTapActive) {
                    activeEmpty = closestIndex >= 0 ? labelData[closestIndex].empty : null;
                }

                // --- Layering & depth fade -----------------------------------
                // Nearer labels stack on top of farther ones; the hovered one always
                // wins. Farther labels fade a little so the ordering reads even when
                // their pills overlap.
                let minCamDist = Infinity;
                let maxCamDist = -Infinity;
                labelData.forEach((data) => {
                    if (data.camDist < minCamDist) minCamDist = data.camDist;
                    if (data.camDist > maxCamDist) maxCamDist = data.camDist;
                });
                const camDistSpan = maxCamDist - minCamDist;

                // far -> near, so the nearest label ends up with the highest z-index
                const stacking = labelData
                    .map((_, i) => i)
                    .sort((a, b) => labelData[b].camDist - labelData[a].camDist);
                stacking.forEach((index, rank) => {
                    const data = labelData[index];
                    data.zIndex = Math.min(10 + rank, 90); // keep labels below the UI panels
                    const t = camDistSpan > 0.001 ? (data.camDist - minCamDist) / camDistSpan : 0;
                    data.opacity = 1 - LABEL_DEPTH_FADE * t;
                });
                if (closestIndex >= 0) {
                    const data = labelData[closestIndex];
                    data.zIndex = 95;
                    data.opacity = 1;
                }

                // --- Declutter -------------------------------------------------
                // Подписи НЕ скрываются: все эмпти видны всегда, порядок наложения
                // задаётся z-index по глубине (ближние выше), см. блок выше.


                // Clear overlay canvas
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

                // Draw hover radius for ALL empties if debug is enabled
                if (showDebug) {
                    overlayCtx.fillStyle = hoverRadiusColor;

                    labelData.forEach((data) => {
                        overlayCtx.beginPath();
                        overlayCtx.ellipse(
                            data.x,
                            data.y,
                            // draw the actual pill footprint, not the padded hit area
                            data.pillRadiusX,
                            data.pillRadiusY,
                            0,
                            0,
                            Math.PI * 2
                        );
                        overlayCtx.fill();
                    });
                }

                // Create label elements
                labelData.forEach((data, i) => {
                    const label = document.createElement('div');
                    label.className = 'empty-label';
                    // The pill (padding, border, radius, inner text) scales with font-size,
                    // which came from model size and this empty's distance to the camera.
                    label.style.fontSize = data.fontSize.toFixed(2) + 'px';
                    label.style.left = data.x.toFixed(2) + 'px';
                    label.style.top = data.y.toFixed(2) + 'px';
                    label.style.zIndex = data.zIndex;
                    label.style.opacity = data.opacity.toFixed(3);

                    const name = document.createElement('div');
                    name.textContent = data.name;
                    label.appendChild(name);

                    const isHovered = (i === closestIndex);
                    label.style.color = isHovered ? emptyHoverColor : emptyLabelColor;
                    if (isHovered) {
                        label.classList.add('hovered');
                    }

                    document.body.appendChild(label);
                    emptyLabels.push({ element: label, data: data });
                });
                currentHoverIndex = closestIndex;

                // --- Description tooltip --------------------------------------
                // Отдельный элемент поверх сцены, а не дочерний у плашки: иначе
                // ширина тултипа ограничивается шириной узкой пилюли и текст
                // переносится в вертикальную колбаску.
                const activeData = activeEmpty
                    ? labelData.find((d) => d.empty === activeEmpty)
                    : null;

                if (activeData && activeData.description) {
                    const tooltipFont = THREE.MathUtils.clamp(
                        activeData.fontSize * 1.25,
                        TOOLTIP_MIN_FONT_PX,
                        TOOLTIP_MAX_FONT_PX
                    );

                    tooltipEl.textContent = activeData.description;
                    tooltipEl.style.fontSize = tooltipFont.toFixed(2) + 'px';
                    tooltipEl.style.display = 'block';

                    // Measure once it is visible, then keep it inside the viewport
                    const tw = tooltipEl.offsetWidth;
                    const th = tooltipEl.offsetHeight;
                    const margin = 8;
                    const halfW = tw / 2;
                    const maxLeft = Math.max(margin + halfW, window.innerWidth - margin - halfW);
                    const left = Math.min(Math.max(activeData.x, margin + halfW), maxLeft);

                    const gap = activeData.pillRadiusY + tooltipFont * 0.45;
                    let top = activeData.y + gap;
                    if (top + th > window.innerHeight - margin) {
                        top = Math.max(margin, activeData.y - gap - th);
                    }

                    tooltipEl.style.left = left.toFixed(1) + 'px';
                    tooltipEl.style.top = top.toFixed(1) + 'px';
                } else {
                    tooltipEl.style.display = 'none';
                }

                if (showDebug) {
                    const labelStats = document.getElementById('labelStats');
                    if (labelStats) {
                        const sizes = labelData.map((d) => d.fontSize);
                        labelStats.textContent = sizes.length
                            ? `${sizes.length} × ${Math.min(...sizes).toFixed(1)}–${Math.max(...sizes).toFixed(1)} px`
                            : '0';
                    }
                }
            } else {
                currentHoverIndex = -1;
                projectedEmpties = [];
                clearEmptyLabels();
                tooltipEl.style.display = 'none';
            }

            // Render scene
            const renderStart = performance.now();
            renderer.render(scene, camera);
            const renderEnd = performance.now();
            renderMs = renderEnd - renderStart;

            const frameEnd = performance.now();
            frameTimeMs = frameEnd - frameStart;

            // Update debug display
            if (showDebug) {
                document.getElementById('fps').textContent = fps;
                document.getElementById('frameTime').textContent = frameTimeMs.toFixed(2);
                document.getElementById('renderTime').textContent = renderMs.toFixed(2);
            }
        }

        animate();
    </script>
</body>
</html>
