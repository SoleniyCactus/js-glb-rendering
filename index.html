<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            background: #0B0E14;
            color: #F8FAFC;
            overflow: hidden;
            /* Prevent mobile bounce/overscroll */
            overscroll-behavior: none;
            /* Prevent text selection on touch */
            -webkit-user-select: none;
            user-select: none;
            /* Prevent iOS zoom on double-tap */
            touch-action: none;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            /* Prevent touch callout on iOS */
            -webkit-touch-callout: none;
            /* Disable all browser touch gestures */
            touch-action: none;
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(248, 250, 252, 0.1);
            border-radius: 12px;
            padding: 20px;
            min-width: 280px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s, opacity 0.3s;
        }

        .controls.hidden {
            transform: translateY(20px);
            opacity: 0;
            pointer-events: none;
        }

        .controls::-webkit-scrollbar {
            width: 8px;
        }

        .controls::-webkit-scrollbar-track {
            background: #1E293B;
            border-radius: 4px;
        }

        .controls::-webkit-scrollbar-thumb {
            background: #38BDF8;
            border-radius: 4px;
        }

        .controls h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #F8FAFC;
        }

        .controls-subtitle {
            font-size: 11px;
            color: #64748B;
            margin-bottom: 12px;
        }

        .control-group {
            margin-bottom: 16px;
        }

        .control-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #94A3B8;
            font-weight: 500;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            background: #1E293B;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #38BDF8;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: #22D3EE;
            transform: scale(1.1);
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #38BDF8;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #38BDF8 0%, #22D3EE 100%);
            border: none;
            border-radius: 8px;
            color: #0B0E14;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
        }

        .button:active {
            transform: translateY(0);
        }

        .separator {
            height: 1px;
            background: rgba(248, 250, 252, 0.1);
            margin: 16px 0;
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: #38BDF8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .value {
            color: #22D3EE;
            font-family: 'SF Mono', 'Consolas', monospace;
            font-size: 12px;
        }

        .file-input {
            margin-bottom: 20px;
        }

        .file-input input[type="file"] {
            display: none;
        }

        .file-label {
            display: block;
            padding: 12px;
            background: linear-gradient(135deg, #F97316 0%, #F59E0B 100%);
            border-radius: 8px;
            text-align: center;
            color: #0B0E14;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .file-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.4);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 13px;
            color: #94A3B8;
            cursor: pointer;
            margin: 0;
        }

        .color-picker {
            width: 100%;
            height: 40px;
            border: 1px solid rgba(248, 250, 252, 0.1);
            border-radius: 8px;
            background: #1E293B;
            cursor: pointer;
        }

        .debug {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(248, 250, 252, 0.1);
            border-radius: 12px;
            padding: 16px;
            font-size: 11px;
            color: #94A3B8;
            line-height: 1.8;
            font-family: 'SF Mono', 'Consolas', monospace;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            display: none;
        }

        .debug div {
            margin-bottom: 4px;
        }

        .debug span {
            color: #22D3EE;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30, 41, 59, 0.95);
            padding: 24px 48px;
            border-radius: 12px;
            font-size: 16px;
            color: #F8FAFC;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .empty-label {
            position: absolute;
            font-size: 12px;
            color: #FFFF00;
            font-family: 'SF Mono', 'Consolas', monospace;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            cursor: pointer;
            transition: color 0.1s;
        }

        .empty-label.hovered {
            color: #00FFFF;
        }

        .toggle-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #F97316;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(249, 115, 22, 0.4);
            transition: all 0.2s;
            z-index: 1001;
        }

        .toggle-controls:hover {
            background: #EA580C;
            transform: scale(1.05);
        }

        .toggle-controls:active {
            transform: scale(0.95);
        }

        /* Mobile adaptations */
        @media (max-width: 768px) {
            .controls {
                top: auto;
                bottom: 90px;
                right: 20px;
                left: auto;
                min-width: 280px;
                max-width: 320px;
                max-height: 50vh;
                padding: 16px;
            }

            .controls h2 {
                font-size: 16px;
            }

            .control-group label {
                font-size: 11px;
            }

            input[type="range"] {
                height: 6px;
            }

            input[type="range"]::-webkit-slider-thumb {
                width: 18px;
                height: 18px;
            }

            input[type="range"]::-moz-range-thumb {
                width: 18px;
                height: 18px;
            }

            button {
                padding: 10px 16px;
                font-size: 13px;
            }

            .debug {
                left: 10px;
                bottom: 10px;
                font-size: 10px;
                padding: 12px;
            }

            .empty-label {
                font-size: 14px;
                text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <canvas id="overlayCanvas" style="position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5;"></canvas>

    <div class="controls hidden">
        <h2>3D Model Viewer</h2>
        <div class="controls-subtitle">
            Rotate: LMB Drag • Pan: MMB Drag
        </div>

        <div class="file-input">
            <input type="file" id="fileInput" accept=".glb,.gltf">
            <label for="fileInput" class="file-label">Загрузить GLB модель</label>
        </div>

        <div class="control-group">
            <label>Model: <span class="value" id="modelName">No model loaded</span></label>
        </div>

        <div class="control-group">
            <label>Rotation X: <span class="value" id="rotXDisplay">20.0</span>  Y: <span class="value" id="rotYDisplay">30.0</span></label>
        </div>

        <div class="control-group">
            <label>Pan X: <span class="value" id="panXDisplay">0.00</span>  Y: <span class="value" id="panYDisplay">0.00</span></label>
        </div>

        <div class="separator"></div>

        <div class="section-title">Position</div>
        <div class="control-group">
            <label>Pos X <span class="value" id="panXValue">0.00</span></label>
            <input type="range" id="panX" min="-10" max="10" value="0" step="0.1">
        </div>
        <div class="control-group">
            <label>Pos Y <span class="value" id="panYValue">0.00</span></label>
            <input type="range" id="panY" min="-10" max="10" value="0" step="0.1">
        </div>
        <button class="button" id="resetPosition">Reset Position</button>

        <div class="separator"></div>

        <div class="control-group">
            <label>Model Scale <span class="value" id="scaleValue">1.00</span></label>
            <input type="range" id="scale" min="0.01" max="10" value="1" step="0.01">
        </div>

        <div class="separator"></div>

        <div class="checkbox-group">
            <input type="checkbox" id="autoSpin">
            <label for="autoSpin">Auto-Spin</label>
        </div>
        <div class="control-group" id="spinSpeedGroup" style="display: none;">
            <label>Spin Speed <span class="value" id="spinSpeedValue">1.0</span> <span class="value" id="spinDirection">Right</span></label>
            <input type="range" id="spinSpeed" min="-5" max="5" value="1" step="0.1">
        </div>

        <div class="separator"></div>

        <div class="section-title">Base Rotation (Blender-style)</div>
        <div class="control-group">
            <label>Rotation X <span class="value" id="baseRotXValue">0°</span></label>
            <input type="range" id="baseRotX" min="-180" max="180" value="0" step="1">
        </div>
        <div class="control-group">
            <label>Rotation Y <span class="value" id="baseRotYValue">0°</span></label>
            <input type="range" id="baseRotY" min="-180" max="180" value="0" step="1">
        </div>
        <div class="control-group">
            <label>Rotation Z <span class="value" id="baseRotZValue">0°</span></label>
            <input type="range" id="baseRotZ" min="-180" max="180" value="0" step="1">
        </div>
        <button class="button" id="resetBaseRotation">Reset Base Rotation</button>

        <div class="separator"></div>

        <div class="section-title">View Rotation</div>
        <div class="control-group">
            <label>Pitch (X) <span class="value" id="viewRotXValue">20°</span></label>
            <input type="range" id="viewRotX" min="-180" max="180" value="20" step="1">
        </div>
        <div class="control-group">
            <label>Yaw (Y) <span class="value" id="viewRotYValue">30°</span></label>
            <input type="range" id="viewRotY" min="-180" max="180" value="30" step="1">
        </div>
        <button class="button" id="resetViewRotation">Reset View Rotation</button>

        <div class="separator"></div>

        <div class="checkbox-group">
            <input type="checkbox" id="showDebug">
            <label for="showDebug">Debug</label>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="showEmptyLabels" checked>
            <label for="showEmptyLabels">Show Empty Labels</label>
        </div>

        <div class="control-group">
            <label>Empty Label Color</label>
            <input type="color" id="emptyLabelColor" class="color-picker" value="#ffff00">
        </div>

        <div class="control-group">
            <label>Empty Hover Color</label>
            <input type="color" id="emptyHoverColor" class="color-picker" value="#00ffff">
        </div>

        <div class="control-group">
            <label>Hover Radius Color</label>
            <input type="color" id="hoverRadiusColor" class="color-picker" value="#00000080">
        </div>

        <div class="control-group">
            <label>Clear Color</label>
            <input type="color" id="clearColor" class="color-picker" value="#0b0e14">
        </div>
    </div>

    <div class="debug" id="debug">
        <div id="statsInfo">No model loaded</div>
        <div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(248, 250, 252, 0.1);">
            <div>FPS: <span id="fps">0</span></div>
            <div>Frame Time: <span id="frameTime">0.00</span> ms</div>
            <div>Render: <span id="renderTime">0.00</span> ms</div>
        </div>
    </div>

    <div class="loading" id="loading" style="display: none;">Loading...</div>

    <button class="toggle-controls">☰</button>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // Scene setup
        const canvas = document.getElementById('canvas');
        const overlayCanvas = document.getElementById('overlayCanvas');
        const overlayCtx = overlayCanvas.getContext('2d');

        // Set overlay canvas size
        overlayCanvas.width = window.innerWidth;
        overlayCanvas.height = window.innerHeight;

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 8);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.9);
        directionalLight.position.set(0, 1, 1);
        scene.add(directionalLight);

        // Scene graph hierarchy matching desktop: Pan -> View Rotation -> Base Rotation -> Model
        const panGroup = new THREE.Group();
        scene.add(panGroup);

        const viewRotationGroup = new THREE.Group();
        panGroup.add(viewRotationGroup);

        const baseRotationGroup = new THREE.Group();
        viewRotationGroup.add(baseRotationGroup);

        // Model itself
        let currentModel = null;
        let empties = [];
        let emptyLabels = [];

        // State variables
        let viewRotX = 20, viewRotY = 30;
        let panX = 0, panY = 0;
        let baseRotX = 0, baseRotY = 0, baseRotZ = 0;
        let modelScale = 1;
        let autoSpin = false;
        let spinSpeed = 1;
        let showDebug = false;
        let showEmptyLabels = true;
        let clearColor = new THREE.Color(0x0B0E14);
        let emptyLabelColor = '#FFFF00';
        let emptyHoverColor = '#00FFFF';
        let hoverRadiusColor = 'rgba(0, 0, 0, 0.5)'; // Semi-transparent black
        let emptyHoverRadius = 20;
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if (isMobile) {
            emptyHoverRadius = 80; // Larger radius for mobile
        }

        // Mouse interaction
        let isDragging = false;
        let isPanning = false;
        let lastMouseX = 0, lastMouseY = 0;
        let mouseX = 0, mouseY = 0;

        // Performance tracking
        let frameCount = 0;
        let lastTime = performance.now();
        let fps = 0;
        let frameTimeMs = 0;
        let renderMs = 0;

        // UI elements
        const fileInput = document.getElementById('fileInput');
        const statsInfo = document.getElementById('statsInfo');
        const loading = document.getElementById('loading');
        const debug = document.getElementById('debug');
        const controlsPanel = document.querySelector('.controls');
        const toggleBtn = document.querySelector('.toggle-controls');

        // Toggle controls visibility (for all devices now)
        if (toggleBtn) {
            // Initialize icon based on current state
            toggleBtn.textContent = controlsPanel.classList.contains('hidden') ? '☰' : '✕';

            toggleBtn.addEventListener('click', () => {
                controlsPanel.classList.toggle('hidden');
                toggleBtn.textContent = controlsPanel.classList.contains('hidden') ? '☰' : '✕';
            });
        }

        // Get all control elements
        const panXSlider = document.getElementById('panX');
        const panYSlider = document.getElementById('panY');
        const viewRotXSlider = document.getElementById('viewRotX');
        const viewRotYSlider = document.getElementById('viewRotY');
        const baseRotXSlider = document.getElementById('baseRotX');
        const baseRotYSlider = document.getElementById('baseRotY');
        const baseRotZSlider = document.getElementById('baseRotZ');
        const scaleSlider = document.getElementById('scale');
        const autoSpinCheckbox = document.getElementById('autoSpin');
        const spinSpeedSlider = document.getElementById('spinSpeed');
        const showDebugCheckbox = document.getElementById('showDebug');
        const showEmptyLabelsCheckbox = document.getElementById('showEmptyLabels');
        const clearColorPicker = document.getElementById('clearColor');
        const emptyLabelColorPicker = document.getElementById('emptyLabelColor');
        const emptyHoverColorPicker = document.getElementById('emptyHoverColor');
        const hoverRadiusColorPicker = document.getElementById('hoverRadiusColor');

        // Mouse events
        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) { // LMB
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            } else if (e.button === 1) { // MMB
                isPanning = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                e.preventDefault();
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            if (isDragging) {
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;

                // Quaternion-based rotation for smooth orbiting
                // Create delta rotations in camera space
                const deltaRotationQuaternion = new THREE.Quaternion()
                    .setFromEuler(new THREE.Euler(
                        dy * 0.5 * Math.PI / 180,  // pitch
                        dx * 0.5 * Math.PI / 180,  // yaw
                        0,
                        'YXZ'
                    ));

                // Apply delta rotation to current quaternion
                viewRotationGroup.quaternion.multiplyQuaternions(
                    deltaRotationQuaternion,
                    viewRotationGroup.quaternion
                );

                // Extract euler angles for display
                const euler = new THREE.Euler().setFromQuaternion(viewRotationGroup.quaternion, 'YXZ');
                viewRotX = euler.x * 180 / Math.PI;
                viewRotY = euler.y * 180 / Math.PI;

                lastMouseX = e.clientX;
                lastMouseY = e.clientY;

                // Update displays
                document.getElementById('rotXDisplay').textContent = viewRotX.toFixed(1);
                document.getElementById('rotYDisplay').textContent = viewRotY.toFixed(1);
                document.getElementById('viewRotXValue').textContent = viewRotX.toFixed(0) + '°';
                document.getElementById('viewRotYValue').textContent = viewRotY.toFixed(0) + '°';
                viewRotXSlider.value = viewRotX;
                viewRotYSlider.value = viewRotY;
            } else if (isPanning) {
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;

                panX += dx * 0.01;
                panY -= dy * 0.01;

                lastMouseX = e.clientX;
                lastMouseY = e.clientY;

                updatePan();
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (e.button === 0) isDragging = false;
            if (e.button === 1) isPanning = false;
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY * -0.001;
            modelScale = Math.max(0.01, Math.min(10, modelScale + delta));
            scaleSlider.value = modelScale;
            document.getElementById('scaleValue').textContent = modelScale.toFixed(2);
            if (currentModel) {
                currentModel.scale.setScalar(modelScale);
            }
        });

        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // Touch controls for mobile
        let touchStartDistance = 0;
        let touchStartScale = modelScale;
        let isTouchRotating = false;
        let isTouchPanning = false;
        let lastTouchX = 0;
        let lastTouchY = 0;
        let touchStartX = 0;
        let touchStartY = 0;
        let touchMoved = false;
        let isTapActive = false; // Track if a tap is currently active

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();

            if (e.touches.length === 1) {
                // Single finger - rotation or tap
                isTouchRotating = true;
                touchMoved = false;
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
                touchStartX = lastTouchX;
                touchStartY = lastTouchY;

                // Clear previous tap if starting new touch
                if (!isTapActive) {
                    mouseX = -1000;
                    mouseY = -1000;
                }
                isTapActive = false;
            } else if (e.touches.length === 2) {
                // Two fingers - pan or pinch
                isTouchRotating = false;
                isTouchPanning = true;
                touchMoved = true; // Two-finger actions are not taps
                isTapActive = false; // Clear tap state

                // Clear tap position
                mouseX = -1000;
                mouseY = -1000;

                // Calculate initial distance for pinch
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                touchStartDistance = Math.sqrt(dx * dx + dy * dy);
                touchStartScale = modelScale;

                // Initial position for panning
                lastTouchX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                lastTouchY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();

            if (e.touches.length === 1 && isTouchRotating) {
                // Single finger - rotation (same as LMB drag)
                const dx = e.touches[0].clientX - lastTouchX;
                const dy = e.touches[0].clientY - lastTouchY;

                // Track if significant movement occurred (increased tolerance to 10px)
                if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                    touchMoved = true;
                }

                const deltaRotationQuaternion = new THREE.Quaternion()
                    .setFromEuler(new THREE.Euler(
                        dy * 0.5 * Math.PI / 180,
                        dx * 0.5 * Math.PI / 180,
                        0,
                        'YXZ'
                    ));

                viewRotationGroup.quaternion.multiplyQuaternions(
                    deltaRotationQuaternion,
                    viewRotationGroup.quaternion
                );

                const euler = new THREE.Euler().setFromQuaternion(viewRotationGroup.quaternion, 'YXZ');
                viewRotX = euler.x * 180 / Math.PI;
                viewRotY = euler.y * 180 / Math.PI;

                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;

                document.getElementById('rotXDisplay').textContent = viewRotX.toFixed(1);
                document.getElementById('rotYDisplay').textContent = viewRotY.toFixed(1);
                document.getElementById('viewRotXValue').textContent = viewRotX.toFixed(0) + '°';
                document.getElementById('viewRotYValue').textContent = viewRotY.toFixed(0) + '°';
                viewRotXSlider.value = viewRotX;
                viewRotYSlider.value = viewRotY;
            } else if (e.touches.length === 2 && isTouchPanning) {
                // Two fingers - pinch to zoom
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const currentDistance = Math.sqrt(dx * dx + dy * dy);

                if (touchStartDistance > 0) {
                    const scale = currentDistance / touchStartDistance;
                    modelScale = Math.max(0.01, Math.min(10, touchStartScale * scale));
                    scaleSlider.value = modelScale;
                    document.getElementById('scaleValue').textContent = modelScale.toFixed(2);
                    if (currentModel) {
                        currentModel.scale.setScalar(modelScale);
                    }
                }

                // Two fingers - pan (center point movement)
                const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                const panDx = centerX - lastTouchX;
                const panDy = centerY - lastTouchY;

                panX += panDx * 0.01;
                panY -= panDy * 0.01;

                lastTouchX = centerX;
                lastTouchY = centerY;

                updatePan();
            }
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();

            // Check for tap - calculate total distance moved
            if (e.touches.length === 0) {
                const moveDistance = Math.sqrt(
                    Math.pow(e.changedTouches[0].clientX - touchStartX, 2) +
                    Math.pow(e.changedTouches[0].clientY - touchStartY, 2)
                );

                // Tap if moved less than 15px (increased tolerance for finger imprecision)
                if (moveDistance < 15) {
                    // This was a tap - update mouseX/Y for hover detection and keep it active
                    mouseX = touchStartX;
                    mouseY = touchStartY;
                    isTapActive = true; // Keep tap active until next touch
                } else {
                    // Significant movement - not a tap
                    if (!isTapActive) {
                        mouseX = -1000;
                        mouseY = -1000;
                    }
                }
            } else {
                // Multiple fingers still down - clear tap position only if not active tap
                if (!isTapActive) {
                    mouseX = -1000;
                    mouseY = -1000;
                }
            }

            if (e.touches.length === 0) {
                isTouchRotating = false;
                isTouchPanning = false;
                touchStartDistance = 0;
            } else if (e.touches.length === 1) {
                // Switched from 2 fingers to 1 - start rotation mode
                isTouchPanning = false;
                isTouchRotating = true;
                touchStartDistance = 0;
                touchMoved = true; // Finger transition is not a tap
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
                touchStartX = lastTouchX;
                touchStartY = lastTouchY;
            }
        });

        canvas.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            isTouchRotating = false;
            isTouchPanning = false;
            touchStartDistance = 0;
        });

        // Prevent all browser gestures globally (pinch-zoom, swipe-to-navigate, etc.)
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) {
                e.preventDefault(); // Block pinch-zoom
            }
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (e.touches.length > 1) {
                e.preventDefault(); // Block pinch-zoom during move
            }
        }, { passive: false });

        document.addEventListener('gesturestart', (e) => {
            e.preventDefault(); // Block iOS gesture events
        });

        document.addEventListener('gesturechange', (e) => {
            e.preventDefault();
        });

        document.addEventListener('gestureend', (e) => {
            e.preventDefault();
        });

        // Slider events
        panXSlider.oninput = () => {
            panX = parseFloat(panXSlider.value);
            updatePan();
        };

        panYSlider.oninput = () => {
            panY = parseFloat(panYSlider.value);
            updatePan();
        };

        viewRotXSlider.oninput = () => {
            viewRotX = parseFloat(viewRotXSlider.value);
            updateViewRotation();
        };

        viewRotYSlider.oninput = () => {
            viewRotY = parseFloat(viewRotYSlider.value);
            updateViewRotation();
        };

        baseRotXSlider.oninput = () => {
            baseRotX = parseFloat(baseRotXSlider.value);
            updateBaseRotation();
        };

        baseRotYSlider.oninput = () => {
            baseRotY = parseFloat(baseRotYSlider.value);
            updateBaseRotation();
        };

        baseRotZSlider.oninput = () => {
            baseRotZ = parseFloat(baseRotZSlider.value);
            updateBaseRotation();
        };

        scaleSlider.oninput = () => {
            modelScale = parseFloat(scaleSlider.value);
            document.getElementById('scaleValue').textContent = modelScale.toFixed(2);
            if (currentModel) {
                currentModel.scale.setScalar(modelScale);
            }
        };

        autoSpinCheckbox.onchange = () => {
            autoSpin = autoSpinCheckbox.checked;
            document.getElementById('spinSpeedGroup').style.display = autoSpin ? 'block' : 'none';
        };

        spinSpeedSlider.oninput = () => {
            spinSpeed = parseFloat(spinSpeedSlider.value);
            document.getElementById('spinSpeedValue').textContent = spinSpeed.toFixed(1);
            document.getElementById('spinDirection').textContent = spinSpeed < 0 ? 'Left' : 'Right';
        };

        showDebugCheckbox.onchange = () => {
            showDebug = showDebugCheckbox.checked;
            debug.style.display = showDebug ? 'block' : 'none';
        };

        showEmptyLabelsCheckbox.onchange = () => {
            showEmptyLabels = showEmptyLabelsCheckbox.checked;
            if (!showEmptyLabels) {
                clearEmptyLabels();
            }
        };

        clearColorPicker.oninput = () => {
            clearColor = new THREE.Color(clearColorPicker.value);
            scene.background = clearColor;
        };

        emptyLabelColorPicker.oninput = () => {
            emptyLabelColor = emptyLabelColorPicker.value;
        };

        emptyHoverColorPicker.oninput = () => {
            emptyHoverColor = emptyHoverColorPicker.value;
        };

        hoverRadiusColorPicker.oninput = () => {
            // Convert hex to rgba with 0.5 alpha
            const hex = hoverRadiusColorPicker.value;
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            hoverRadiusColor = `rgba(${r}, ${g}, ${b}, 0.5)`;
        };

        // Reset buttons
        document.getElementById('resetPosition').onclick = () => {
            panX = 0;
            panY = 0;
            updatePan();
        };

        document.getElementById('resetBaseRotation').onclick = () => {
            baseRotX = 0;
            baseRotY = 0;
            baseRotZ = 0;
            updateBaseRotation();
        };

        document.getElementById('resetViewRotation').onclick = () => {
            viewRotX = 20;
            viewRotY = 30;
            updateViewRotation();
        };

        // Update functions
        function updatePan() {
            panXSlider.value = panX;
            panYSlider.value = panY;
            document.getElementById('panXValue').textContent = panX.toFixed(2);
            document.getElementById('panYValue').textContent = panY.toFixed(2);
            document.getElementById('panXDisplay').textContent = panX.toFixed(2);
            document.getElementById('panYDisplay').textContent = panY.toFixed(2);
            panGroup.position.set(panX, panY, 0);
        }

        function updateViewRotation() {
            viewRotXSlider.value = viewRotX;
            viewRotYSlider.value = viewRotY;
            document.getElementById('viewRotXValue').textContent = viewRotX.toFixed(0) + '°';
            document.getElementById('viewRotYValue').textContent = viewRotY.toFixed(0) + '°';
            document.getElementById('rotXDisplay').textContent = viewRotX.toFixed(1);
            document.getElementById('rotYDisplay').textContent = viewRotY.toFixed(1);

            // Convert euler angles to quaternion
            const euler = new THREE.Euler(
                viewRotX * Math.PI / 180,
                viewRotY * Math.PI / 180,
                0,
                'YXZ'
            );
            viewRotationGroup.quaternion.setFromEuler(euler);
        }

        function updateBaseRotation() {
            baseRotXSlider.value = baseRotX;
            baseRotYSlider.value = baseRotY;
            baseRotZSlider.value = baseRotZ;
            document.getElementById('baseRotXValue').textContent = baseRotX.toFixed(0) + '°';
            document.getElementById('baseRotYValue').textContent = baseRotY.toFixed(0) + '°';
            document.getElementById('baseRotZValue').textContent = baseRotZ.toFixed(0) + '°';

            baseRotationGroup.rotation.order = 'XYZ';
            baseRotationGroup.rotation.x = baseRotX * Math.PI / 180;
            baseRotationGroup.rotation.y = baseRotY * Math.PI / 180;
            baseRotationGroup.rotation.z = baseRotZ * Math.PI / 180;
        }

        function clearEmptyLabels() {
            emptyLabels.forEach(label => label.element.remove());
            emptyLabels = [];
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        }

        // Load model
        const loader = new GLTFLoader();

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            loading.style.display = 'block';
            const url = URL.createObjectURL(file);

            loader.load(url, (gltf) => {
                loading.style.display = 'none';

                // Remove old model
                if (currentModel) {
                    baseRotationGroup.remove(currentModel);
                }

                currentModel = gltf.scene;
                baseRotationGroup.add(currentModel);

                // Center model
                const box = new THREE.Box3().setFromObject(currentModel);
                const center = box.getCenter(new THREE.Vector3());
                currentModel.position.sub(center);

                // Extract empties - search in raw gltf.parser data AND scene.traverse
                empties = [];

                // Method 1: Use scene.traverse (finds most empties)
                const foundNames = new Set();
                gltf.scene.traverse((node) => {
                    if (node.type === 'Object3D' && !node.isMesh && !node.isLight &&
                        !node.isCamera && !node.isBone && node.name) {
                        empties.push({
                            name: node.name,
                            object: node
                        });
                        foundNames.add(node.name);
                        console.log('Found empty via traverse:', node.name);
                    }
                });

                // Method 2: Check raw nodes from GLTF (might find missing empties)
                if (gltf.parser && gltf.parser.json && gltf.parser.json.nodes) {
                    const promises = gltf.parser.json.nodes.map((node, index) => {
                        if (node.name && (node.mesh === undefined || node.mesh < 0) && !foundNames.has(node.name)) {
                            // This is an empty in GLTF that wasn't found by traverse
                            // Try to find it in the scene by name
                            const sceneNode = gltf.scene.getObjectByName(node.name);
                            if (sceneNode) {
                                empties.push({
                                    name: node.name,
                                    object: sceneNode
                                });
                                console.log('Found empty via parser:', node.name);
                            } else {
                                console.warn('GLTF node', node.name, 'not found in scene, loading manually...');
                                // Load the node manually using parser
                                return gltf.parser.getDependency('node', index).then(object3D => {
                                    if (object3D) {
                                        // Add to scene so it gets proper world transforms
                                        currentModel.add(object3D);
                                        empties.push({
                                            name: node.name,
                                            object: object3D
                                        });
                                        console.log('Manually loaded empty:', node.name);
                                    }
                                }).catch(err => {
                                    console.error('Failed to load node', node.name, err);
                                });
                            }
                        }
                        return null;
                    });

                    // Wait for all manual loads to complete
                    Promise.all(promises.filter(p => p)).then(() => {
                        console.log('All empties loaded, total:', empties.length);
                    });
                }

                // Update stats
                let triangles = 0;
                currentModel.traverse((child) => {
                    if (child.isMesh) {
                        triangles += child.geometry.index ?
                            child.geometry.index.count / 3 :
                            child.geometry.attributes.position.count / 3;
                    }
                });

                statsInfo.innerHTML = `Model: ${file.name}<br>Triangles: ${Math.floor(triangles).toLocaleString()}<br>Empties: ${empties.length}`;
                document.getElementById('modelName').textContent = file.name;
                document.getElementById('triangles').textContent = Math.floor(triangles).toLocaleString();

                URL.revokeObjectURL(url);
            }, undefined, (error) => {
                loading.style.display = 'none';
                console.error('Error loading model:', error);
            });
        };

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            overlayCanvas.width = window.innerWidth;
            overlayCanvas.height = window.innerHeight;
        });

        // Set initial background
        scene.background = clearColor;

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            const frameStart = performance.now();

            // Auto-spin
            if (autoSpin) {
                viewRotY += spinSpeed;
                updateViewRotation();
            }

            // FPS counter
            frameCount++;
            const currentTime = performance.now();
            if (currentTime - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = currentTime;
            }

            // Render empty labels
            if (showEmptyLabels && empties.length > 0) {
                clearEmptyLabels();

                const labelData = [];

                empties.forEach(empty => {
                    const worldPos = new THREE.Vector3();
                    empty.object.getWorldPosition(worldPos);

                    // Project to screen space
                    const screenPos = worldPos.clone();
                    screenPos.project(camera);

                    // Check if in front of camera
                    if (screenPos.z < 1) {
                        const x = (screenPos.x + 1) / 2 * window.innerWidth;
                        const y = (-screenPos.y + 1) / 2 * window.innerHeight;

                        labelData.push({
                            name: empty.name,
                            x: x,
                            y: y,
                            depth: screenPos.z
                        });
                    }
                });

                // Find closest hovered empty (for mouse and touch)
                let closestIndex = -1;
                let closestDepth = 1000;
                const isMobile = window.innerWidth <= 768;
                const detectionRadius = isMobile ? emptyHoverRadius / 2 : emptyHoverRadius;

                labelData.forEach((data, i) => {
                    const dx = mouseX - data.x;
                    const dy = mouseY - data.y;
                    const distSq = dx * dx + dy * dy;

                    if (distSq <= detectionRadius * detectionRadius) {
                        if (data.depth < closestDepth) {
                            closestDepth = data.depth;
                            closestIndex = i;
                        }
                    }
                });

                // Clear overlay canvas
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

                // Draw hover radius for ALL empties if debug is enabled
                if (showDebug) {
                    const isMobile = window.innerWidth <= 768;
                    const radius = isMobile ? emptyHoverRadius / 2 : emptyHoverRadius;
                    overlayCtx.fillStyle = hoverRadiusColor;

                    labelData.forEach((data) => {
                        overlayCtx.beginPath();
                        overlayCtx.arc(data.x, data.y, radius, 0, Math.PI * 2);
                        overlayCtx.fill();
                    });
                }

                // Create label elements
                labelData.forEach((data, i) => {
                    const label = document.createElement('div');
                    label.className = 'empty-label';
                    label.textContent = data.name;

                    // Calculate text dimensions to center properly
                    const tempSpan = document.createElement('span');
                    tempSpan.style.visibility = 'hidden';
                    tempSpan.style.position = 'absolute';
                    tempSpan.style.fontFamily = "'SF Mono', 'Consolas', monospace";
                    tempSpan.style.fontSize = window.innerWidth <= 768 ? '14px' : '12px';
                    tempSpan.textContent = data.name;
                    document.body.appendChild(tempSpan);
                    const textWidth = tempSpan.offsetWidth;
                    const textHeight = tempSpan.offsetHeight;
                    document.body.removeChild(tempSpan);

                    // Center both horizontally and vertically
                    label.style.left = (data.x - textWidth / 2) + 'px';
                    label.style.top = (data.y - textHeight / 2) + 'px';

                    const isHovered = (i === closestIndex);
                    label.style.color = isHovered ? emptyHoverColor : emptyLabelColor;
                    if (isHovered) {
                        label.classList.add('hovered');
                    }

                    document.body.appendChild(label);
                    emptyLabels.push({ element: label, data: data });
                });
            } else {
                clearEmptyLabels();
            }

            // Render scene
            const renderStart = performance.now();
            renderer.render(scene, camera);
            const renderEnd = performance.now();
            renderMs = renderEnd - renderStart;

            const frameEnd = performance.now();
            frameTimeMs = frameEnd - frameStart;

            // Update debug display
            if (showDebug) {
                document.getElementById('fps').textContent = fps;
                document.getElementById('frameTime').textContent = frameTimeMs.toFixed(2);
                document.getElementById('renderTime').textContent = renderMs.toFixed(2);
            }
        }

        animate();
    </script>
</body>
</html>
